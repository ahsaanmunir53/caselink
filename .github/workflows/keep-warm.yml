# Render's free plan puts the API to sleep after 15 minutes without traffic; waking takes about a
# minute. This pings it every 10 minutes in Singapore office hours on weekdays (01:00-10:00 UTC),
# roughly 210 hours a month. Render's 750 free hours are per workspace: with Hoshiyar's keep-warm
# too, both together stay near 420 hours. Disable this workflow when you don't need it.
#
# Set the repository variable BACKEND_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://caselink-api.onrender.com
name: Keep API warm

on:
  schedule:
    - cron: "*/10 1-10 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.BACKEND_URL }}/api/health" > /dev/null || true
